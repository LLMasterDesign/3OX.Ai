# 3ox.store — nginx server block
# Copy to /etc/nginx/sites-available/3ox.store and symlink to sites-enabled

server {
    listen 80;
    server_name 3ox.store www.3ox.store;
    root /var/www/3ox.store;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|css|js|ico|svg|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
