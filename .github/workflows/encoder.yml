# Encoder validation — hex index + Gensing line-1 chips
# Paths contain (3) — use env + "$VAR" so bash never parses subshells.
name: encoder

on:
  push:
    branches: [main, '3ox.agent/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TPW_WARDEN: .3ox/(3)Rules/exc/tpw/Axis.Warden.spec
      TPW_TAPE: .3ox/(3)Rules/exc/tpw/Axis.Tape.spec
      TPW_PULSE: .3ox/(3)Rules/exc/tpw/Axis.Pulse.spec
      TPW_SPIN: .3ox/(3)Rules/exc/tpw/TPW.SPIN.spec
      RA_BUNDLE: .3ox/(3)Rules/exc/ring-a/Ring.A.BUNDLE.spec
      RA_A0: .3ox/(3)Rules/exc/ring-a/Ring.A.A0.spec
      RA_A1: .3ox/(3)Rules/exc/ring-a/Ring.A.A1.spec
      RA_A2: .3ox/(3)Rules/exc/ring-a/Ring.A.A2.spec
      RA_A3: .3ox/(3)Rules/exc/ring-a/Ring.A.A3.spec
      RA_A4: .3ox/(3)Rules/exc/ring-a/Ring.A.A4.spec
      RA_A5: .3ox/(3)Rules/exc/ring-a/Ring.A.A5.spec
      RA_A6: .3ox/(3)Rules/exc/ring-a/Ring.A.A6.spec
      RA_A7: .3ox/(3)Rules/exc/ring-a/Ring.A.A7.spec
      RA_A8: .3ox/(3)Rules/exc/ring-a/Ring.A.A8.spec
      RB_BUNDLE: .3ox/(3)Rules/exc/ring-b/Ring.B.BUNDLE.spec
      RB_B0: .3ox/(3)Rules/exc/ring-b/Ring.B.B0.spec
      RB_B1: .3ox/(3)Rules/exc/ring-b/Ring.B.B1.spec
      RB_B2: .3ox/(3)Rules/exc/ring-b/Ring.B.B2.spec
      RB_B3: .3ox/(3)Rules/exc/ring-b/Ring.B.B3.spec
      RB_B4: .3ox/(3)Rules/exc/ring-b/Ring.B.B4.spec
      RB_B5: .3ox/(3)Rules/exc/ring-b/Ring.B.B5.spec
      RB_B6: .3ox/(3)Rules/exc/ring-b/Ring.B.B6.spec
      RB_B7: .3ox/(3)Rules/exc/ring-b/Ring.B.B7.spec
      RB_B8: .3ox/(3)Rules/exc/ring-b/Ring.B.B8.spec
      RC_BUNDLE: .3ox/(3)Rules/exc/ring-c/Ring.C.BUNDLE.spec
      RC_C0: .3ox/(3)Rules/exc/ring-c/Ring.C.C0.spec
      RC_C1: .3ox/(3)Rules/exc/ring-c/Ring.C.C1.spec
      RC_C2: .3ox/(3)Rules/exc/ring-c/Ring.C.C2.spec
      RC_C3: .3ox/(3)Rules/exc/ring-c/Ring.C.C3.spec
      RC_C4: .3ox/(3)Rules/exc/ring-c/Ring.C.C4.spec
      RC_C5: .3ox/(3)Rules/exc/ring-c/Ring.C.C5.spec
      RC_C6: .3ox/(3)Rules/exc/ring-c/Ring.C.C6.spec
      RC_C7: .3ox/(3)Rules/exc/ring-c/Ring.C.C7.spec
      RC_C8: .3ox/(3)Rules/exc/ring-c/Ring.C.C8.spec
    steps:
      - uses: actions/checkout@v4

      - name: Validate hex.index.json
        run: python3 scripts/encoder_validate.py

      - name: Warden twelve laws (limits.toml)
        run: python3 scripts/warden_laws_validate.py

      - name: 3OX.Core{} slot chamber (k00..k26)
        run: python3 scripts/core_slots_validate.py

      - name: TPW Gensing line-1 chips (0x000-0x003)
        run: |
          python3 scripts/encoder_validate.py --doc "$TPW_WARDEN"
          python3 scripts/encoder_validate.py --doc "$TPW_TAPE"
          python3 scripts/encoder_validate.py --doc "$TPW_PULSE"
          python3 scripts/encoder_validate.py --doc "$TPW_SPIN"

      - name: Ring.A Gensing line-1 chips (0x110-0x119)
        run: |
          python3 scripts/encoder_validate.py --doc "$RA_BUNDLE"
          python3 scripts/encoder_validate.py --doc "$RA_A0"
          python3 scripts/encoder_validate.py --doc "$RA_A1"
          python3 scripts/encoder_validate.py --doc "$RA_A2"
          python3 scripts/encoder_validate.py --doc "$RA_A3"
          python3 scripts/encoder_validate.py --doc "$RA_A4"
          python3 scripts/encoder_validate.py --doc "$RA_A5"
          python3 scripts/encoder_validate.py --doc "$RA_A6"
          python3 scripts/encoder_validate.py --doc "$RA_A7"
          python3 scripts/encoder_validate.py --doc "$RA_A8"

      - name: Ring.B Gensing line-1 chips (0x120-0x129)
        run: |
          python3 scripts/encoder_validate.py --doc "$RB_BUNDLE"
          python3 scripts/encoder_validate.py --doc "$RB_B0"
          python3 scripts/encoder_validate.py --doc "$RB_B1"
          python3 scripts/encoder_validate.py --doc "$RB_B2"
          python3 scripts/encoder_validate.py --doc "$RB_B3"
          python3 scripts/encoder_validate.py --doc "$RB_B4"
          python3 scripts/encoder_validate.py --doc "$RB_B5"
          python3 scripts/encoder_validate.py --doc "$RB_B6"
          python3 scripts/encoder_validate.py --doc "$RB_B7"
          python3 scripts/encoder_validate.py --doc "$RB_B8"

      - name: Ring.C Gensing line-1 chips (0x130-0x139)
        run: |
          python3 scripts/encoder_validate.py --doc "$RC_BUNDLE"
          python3 scripts/encoder_validate.py --doc "$RC_C0"
          python3 scripts/encoder_validate.py --doc "$RC_C1"
          python3 scripts/encoder_validate.py --doc "$RC_C2"
          python3 scripts/encoder_validate.py --doc "$RC_C3"
          python3 scripts/encoder_validate.py --doc "$RC_C4"
          python3 scripts/encoder_validate.py --doc "$RC_C5"
          python3 scripts/encoder_validate.py --doc "$RC_C6"
          python3 scripts/encoder_validate.py --doc "$RC_C7"
          python3 scripts/encoder_validate.py --doc "$RC_C8"
