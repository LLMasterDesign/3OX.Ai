# Encoder Phase 1 — hex index + optional line-1 chip fixture
name: encoder

on:
  push:
    branches: [main, '3ox.agent/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate hex.index.json
        run: python3 scripts/encoder_validate.py

      - name: Validate fixture doc line-1 chip
        run: python3 scripts/encoder_validate.py --doc scripts/encoder_fixtures/valid_line1.md

      - name: Encoder MAP dry run (receipt + tape)
        run: python3 scripts/encoder_dry_run.py --code 0x02A

      - name: EXC v1 minimal boundary (fixture)
        run: python3 scripts/exc_validate.py scripts/exc_fixtures/encoder_minimal.exc

      - name: EXC Axis.Warden (k00) canonical + limits shim
        run: |
          python3 scripts/exc_validate.py .3ox/(3)Rules/exc/Axis.Warden.exc --canonical .3ox/(3)Rules/exc/Axis.Warden.exc
          python3 .3ox/(3)Rules/exc/Axis.Warden.exs

      - name: 3OX.Core{} slot chamber (k00..k26)
        run: python3 scripts/core_slots_validate.py
