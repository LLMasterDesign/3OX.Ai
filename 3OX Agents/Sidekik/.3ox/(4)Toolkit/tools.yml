# 3OX.Sidekik tools — daily-driver capabilities

tools:
  - name: inference
    type: llm
    enabled: true
    serving: single_slot
    hydrate_from:
      - slot.receipt_tail
      - slot.status_snapshot
      - slot.runtime_log_slice

  - name: triage
    type: script
    enabled: true
    runner: ruby
    entry: scripts/triage.rb

  - name: dispatch
    type: script
    enabled: true
    runner: ruby
    entry: scripts/dispatch.rb

  - name: note
    type: script
    enabled: true
    runner: ruby
    entry: scripts/note.rb

  - name: status
    type: script
    enabled: true
    runner: ruby
    entry: scripts/status.rb

  - name: teleprompt
    type: script
    enabled: true
    runner: ruby
    entry: scripts/teleprompt.rb
    note: "Emits TPR.SPEAKER.MESH.json + TPR.ROUTE.MAP.json fragments. TPR (TelePromptR) is the only Telegram speaker; agents never call the Telegram Bot API."

slots:
  E043:
    allowed_tools: [inference, triage, dispatch, note, status, teleprompt]
    allowed_adapters: [tpr, mesh]
    allowed_scopes: [".raven/", ".3ox/(6)Pulse/runtime/", "!0UT.SIDEKIK/tpr/"]
