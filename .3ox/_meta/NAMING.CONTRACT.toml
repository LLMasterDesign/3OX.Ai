# Naming contract — conventions for this cube

[brand]
written = "3OX"
spoken  = "BOX"
product = "BOX.Ai"
note    = "3 is the triadic B-glyph; do not read 3OX as three-ox or ox."

[naming]
style = "UPPER.DOT"              # AGENT.NAME, SERVICE.NAME
separator = "."

[core]
root      = "3OX.Core{}"
axis     = "3OX.Core{Axis}"
encode   = "3OX.Core{Encode}"
ring     = "3OX.Core{Ring}"
system   = "3OX.Core{System}"
equation = "Axis[3] + Encode[6] + Ring[9] + System[9] = 27"

[core.rotor]
name        = "3OX.SPIN"
walks       = "3OX.Core{Axis}"
order       = ["Warden", "Tape", "Pulse"]
spec        = ".3ox/(3)Rules/exc/axis/3OX.SPIN.spec"
hex         = "0x003"
slot        = "k00"
note        = "The rotor is the clock — Pulse edges arrive only on spin."

[core.deprecated]
"TPW.SPIN"   = "renamed to 3OX.SPIN; rotor walks Core{Axis}"
"TPW Triad"  = "renamed to Core{Axis} (3OX.SPIN Triad)"
".../tpw/"   = "renamed to .../axis/ under .3ox/(3)Rules/exc/"
"Gatekeeper" = "renamed to Supervisor; lives at Core{System}.Daemon (k21); was the first daemon, alongside Warden / Tape / Pulse"
"Lisp→Tape"  = "superseded by ARCHITECTURE.SPEC §10: Tape (k01) is BEAM/Elixir; Lisp moves to Supervisor (k21) continuity host + .vec3/proc/agents/ entity cores"

[core.daemons]
note  = "Daemons are runtime process classes. κ27 slots are identity authorities. Two different planes — see _meta/canon/ARCHITECTURE.SPEC.md §3 + _meta/canon/ARCHITECTURE.RECONCILIATION.md Conflict 1."
first = ["Warden", "Tape", "Pulse"]    # κ00–k02 daemons; first three at boot
later = ["Queue", "Worker"]            # added after the first three
"Supervisor.formerly" = "Gatekeeper"
"Scheduler.status"    = "TBD — Scheduler / Queue / Worker interaction model not yet locked; see ARCHITECTURE.RECONCILIATION.md §Conflict 1 future work"

[core.languages]
"Warden.k00"    = "Rust"
"Tape.k01"      = "Elixir/BEAM"
"Pulse.k02"     = "Elixir/BEAM"        # JSONL on the wire, not authority
"Supervisor.k21" = "Lisp"               # continuity host
"PRISM+"        = "Elixir/BEAM"
"Worker"        = "Lisp invoker"        # hot-loads forms into Supervisor's host
"Raven.cores"   = "Lisp"                # entity cores at .vec3/proc/agents/

[extensions]
service  = ".service"
station  = ".station"
agent    = ".agent"
task     = ".task"
watch    = ".watch"

[staging]
prefix   = "!"                   # !CMD.VPS, !LAUNCHPAD
output   = "!0UT"                # !0UT.BUDGET, !0UT.AGENT

# Layout law — the underscore tier of the prefix system.
#
# CRITICAL RULE: there are exactly TWO underscore-prefixed top-level
# directories. Not three, not four. This is fixed for Quantum reasons
# (per Lucius, 26.05.04). Anything that feels like it needs a third
# `_*/` directory is wrong by construction — find a subfolder home.
[layout]
prefix         = "_"
maximum        = 2
"_meta"        = "cube + canon meta — see [layout.meta] below"
"_TRON"        = "device / runtime / receipts contract"
quantum_lock   = "two _*/ siblings only; see Lucius ruling 26.05.04"

[layout.meta]
"_meta/cube/"  = "the project-root cube's _meta — same four files every cube has (WHOAMI, NAMING.CONTRACT, SESSION.CHECKPOINT, CHANGELOG); mirrors .3ox/_meta/ at every L2/L3 cube"
"_meta/canon/" = "framework-wide architectural canon — ARCHITECTURE.SPEC, ARCHITECTURE.RECONCILIATION, VEC3.SURFACES, RAVEN.SUITE, ENCODER.RULES; governs ALL cubes, not specific to one"
note           = "Top-level _meta/ is split into cube/ and canon/ subfolders. Per-cube .3ox/_meta/ contains the cube's own copies of the four canon files plus BOX.ALIVENESS.equation, no canon/ subfolder needed (cubes don't carry framework canon, they obey it)."
