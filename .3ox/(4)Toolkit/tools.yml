# Tools template — agent capabilities

tools:
  - name: inference
    type: llm
    enabled: true
    # One slot per turn: hydrate from that slot’s artifacts only — not full pipeline watch.
    serving: single_slot
    hydrate_from:
      - slot.receipt_tail
      - slot.status_snapshot
      - slot.runtime_log_slice

  - name: search
    type: read
    enabled: false

  - name: execute
    type: script
    enabled: false
    runner: ruby
    entry: run.rb

# Slot allowlists (κ kernel k00..k26 · ξ entity E000..E215) — see (5)Links/slot.index.kdl
slots:
  k00:
    allowed_tools: []
    allowed_adapters: []
    allowed_scopes: []
  E042:
    allowed_tools: [inference]
    allowed_adapters: []
    allowed_scopes: []
